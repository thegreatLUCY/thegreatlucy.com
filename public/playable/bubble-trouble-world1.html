<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bubble Trouble</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a1230;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;touch-action:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:100%;height:100%;max-width:calc(100vh * 0.5625);overflow:hidden;
    background:#0a1230;box-shadow:0 0 60px rgba(0,0,0,.6)}
  #c{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* HUD */
  #hud{position:absolute;top:14px;right:14px;padding:8px 16px;border-radius:999px;
    background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.08));
    border:2px solid rgba(255,255,255,.35);color:#fff;font-weight:800;font-size:16px;
    text-shadow:0 2px 4px rgba(0,0,0,.5);backdrop-filter:blur(4px)}
  #installTop{position:absolute;top:14px;left:14px;padding:8px 14px;border-radius:999px;border:0;
    background:linear-gradient(180deg,#ffd84d,#f5a623);color:#5a3b00;font-weight:900;font-size:13px;
    box-shadow:0 4px 0 #c07d00,0 6px 14px rgba(0,0,0,.35);cursor:pointer}

  /* hearts — the tension the first version was missing */
  #hearts{position:absolute;top:52px;right:14px;display:flex;gap:5px;font-size:23px;line-height:1;
    text-shadow:0 2px 5px rgba(0,0,0,.6)}
  #hearts .h{color:#ff5d7a}
  #hearts .h.off{color:rgba(255,255,255,.28)}

  /* toast */
  #toast{position:absolute;top:36%;left:0;right:0;text-align:center;color:#fff;font-weight:900;
    font-size:25px;letter-spacing:1px;text-shadow:0 3px 0 rgba(0,0,0,.4),0 6px 16px rgba(0,0,0,.6);
    opacity:0;transform:scale(.8);transition:opacity .2s,transform .2s;pointer-events:none}
  #toast.show{opacity:1;transform:scale(1)}

  /* boss bar */
  #bossbar{display:none;position:absolute;top:56px;left:12%;width:76%;height:16px;border-radius:999px;
    background:rgba(0,0,0,.42);border:2px solid rgba(255,255,255,.45);overflow:hidden}
  #bossfill{width:100%;height:100%;background:linear-gradient(180deg,#ff8a8a,#e02424);transition:width .12s}

  /* combo */
  #combo{position:absolute;top:44%;left:0;right:0;text-align:center;color:#ffe066;font-weight:900;
    font-size:30px;text-shadow:0 3px 0 #b26b00,0 6px 16px rgba(0,0,0,.5);opacity:0;transform:scale(.7);
    transition:opacity .18s,transform .18s;pointer-events:none}
  #combo.show{opacity:1;transform:scale(1)}

  /* tutorial hand */
  #tut{position:absolute;left:0;right:0;bottom:28%;text-align:center;color:#fff;pointer-events:none;
    transition:opacity .3s}
  #tut.hide{opacity:0}
  #tut .txt{font-weight:800;font-size:19px;text-shadow:0 2px 6px rgba(0,0,0,.7);letter-spacing:.3px}
  #tut .hand{width:54px;height:54px;margin:0 auto 8px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff,rgba(255,255,255,.25));
    box-shadow:0 0 0 6px rgba(255,255,255,.18);animation:sweep 1.8s ease-in-out infinite}
  #tut.pulse .hand{animation:sweep .9s ease-in-out infinite}
  @keyframes sweep{0%,100%{transform:translateX(-56px)}50%{transform:translateX(56px)}}

  /* CTA */
  #cta{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;background:rgba(8,16,44,.86);backdrop-filter:blur(6px);opacity:0;pointer-events:none;
    transition:opacity .35s}
  #cta.show{opacity:1;pointer-events:auto}
  #cta img{width:72%;max-width:330px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.6))}
  #ctaTitle{color:#fff;font-size:27px;font-weight:900;text-shadow:0 3px 0 rgba(0,0,0,.35)}
  #ctaSub{color:#cfe6ff;font-size:16px;font-weight:600;text-align:center;padding:0 26px;line-height:1.4}
  #installBtn{margin-top:6px;padding:17px 46px;border:0;border-radius:999px;font-size:21px;font-weight:900;
    color:#4a2f00;background:linear-gradient(180deg,#ffe071,#f5a623);
    box-shadow:0 6px 0 #bf7c00,0 10px 26px rgba(0,0,0,.45);cursor:pointer;animation:bob 1.4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .worlds{color:#9fd0ff;font-size:13px;font-weight:700;letter-spacing:1.4px}
</style>

<div id="wrap"><div id="stage">
  <canvas id="c"></canvas>
  <button id="installTop">INSTALL FREE</button>
  <div id="hud">SCORE 0</div>
  <div id="hearts"></div>

  <div id="bossbar"><div id="bossfill"></div></div>
  <div id="combo">COMBO x2</div>
  <div id="tut"><div class="hand"></div><div class="txt">DRAG TO MOVE — POP THE GERMS!</div></div>
  <div id="cta">
    <img id="ctaLogo" alt="Bubble Trouble">
    <div id="ctaTitle">NICE RUN!</div>
    <div id="ctaSub"></div>
    <button id="installBtn">PLAY FREE</button>
    <div class="worlds">16 WORLDS · 16 BOSSES · FREE</div>
  </div>
</div></div>

<script>document.getElementById('ctaLogo').src = ART.logo;</script>
<script>/* Bubble Trouble — playable ad.
   Rebuilt to match the REAL game loop: enemy waves arrive in a formation, hold, and
   sway/figure-eight across the top while firing DOWN at you (some shots aimed). You drag
   to dodge; the tub auto-fires upward. Hearts, combos, a powerup drop and a boss finisher.
   Losing a heart is the whole tension — the first version had none. */
(function () {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const cta = document.getElementById('cta'), tut = document.getElementById('tut');
  const hud = document.getElementById('hud'), comboEl = document.getElementById('combo');
  const bossbar = document.getElementById('bossbar'), bossfill = document.getElementById('bossfill');
  const heartsEl = document.getElementById('hearts'), toastEl = document.getElementById('toast');

  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);

  // ---------- state (declared before the asset loader: start() runs from a callback) ----------
  const S = { score: 0, combo: 0, comboT: 0, hearts: 3, over: false, won: false, t: 0, shake: 0, iframe: 0 };
  const player = { x: 0, y: 0, r: 34, tx: 0 };
  let bullets = [], enemies = [], eshots = [], pops = [], drops = [], bubbles = [], picks = [];
  let boss = null, bossHP = 0, bossMax = 0, wave = 0, fireT = 0, multiT = 0;
  let formT = 0, pattern = 0;
  let started = false, dragging = false, everDragged = false, waveClearing = false;

  // ---------- assets ----------
  const img = {};
  let loaded = 0, total = Object.keys(ART).length;
  for (const k in ART) {
    const i = new Image();
    i.onload = i.onerror = () => { if (++loaded >= total) start(); };
    i.src = ART[k]; img[k] = i;
  }
  setTimeout(() => { if (!started) start(); }, 1200);

  function reset() {
    player.x = W / 2; player.tx = W / 2; player.y = H - 96;
    bullets = []; enemies = []; eshots = []; pops = []; drops = []; picks = []; boss = null;
    bubbles = Array.from({ length: 16 }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      r: 3 + Math.random() * 8, s: 10 + Math.random() * 20, a: .1 + Math.random() * .2
    }));
    S.score = 0; S.combo = 0; S.hearts = 3; S.over = false; S.won = false; S.iframe = 0;
    wave = 0; multiT = 0;
    drawHearts();
    nextWave();
  }

  function drawHearts() {
    let s = '';
    for (let i = 0; i < 3; i++) s += '<span class="' + (i < S.hearts ? 'h' : 'h off') + '">♥</span>';
    heartsEl.innerHTML = s;
  }
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 1500);
  }

  // ---------- waves: a real formation, not falling rain ----------
  function nextWave() {
    wave++;
    if (wave === 4) { spawnBoss(); return; }
    waveClearing = false;
    pattern = wave % 3;                       // Sway / SwayAndDrop / FigureEight
    const cols = Math.min(5, 3 + wave), rows = wave >= 3 ? 2 : 1;
    const gapX = Math.min(88, (W - 40) / cols), holdY = 130;
    const originX = W / 2 - (cols - 1) * gapX / 2;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        enemies.push({
          hx: originX + c * gapX, hy: holdY + r * 78,   // home slot in the formation
          x: originX + c * gapX, y: -90 - r * 78,       // flies in from above
          r: 32, hp: wave >= 3 ? 2 : 1,
          kind: (r + c) % 3 === 0 ? 'soap' : 'germ',
          fireT: 1.2 + Math.random() * 2.2, dead: false
        });
      }
    }
    if (wave > 1) toast('WAVE ' + wave);
  }

  function spawnBoss() {
    bossMax = 30; bossHP = bossMax;
    boss = { x: W / 2, y: -140, hy: 140, dir: 1, fireT: 1.4, burst: 0 };
    bossbar.style.display = 'block';
    bossfill.style.width = '100%';
    toast('BOSS!');
  }

  // ---------- input ----------
  function px(e) {
    const r = cv.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  }
  function down(e) { dragging = true; everDragged = true; tut.classList.add('hide'); move(e); e.preventDefault(); }
  function move(e) { if (!dragging) return; player.tx = Math.max(34, Math.min(W - 34, px(e).x)); e.preventDefault(); }
  function up(e) { dragging = false; e.preventDefault(); }
  cv.addEventListener('touchstart', down, { passive: false });
  cv.addEventListener('touchmove', move, { passive: false });
  cv.addEventListener('touchend', up, { passive: false });
  cv.addEventListener('mousedown', down);
  window.addEventListener('mousemove', move);
  window.addEventListener('mouseup', up);

  // ---------- fx ----------
  function pop(x, y, c) {
    for (let i = 0; i < 9; i++) {
      const a = Math.random() * 6.28, s = 40 + Math.random() * 110;
      pops.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .45, c });
    }
  }
  function addScore(n, x, y) {
    S.combo++; S.comboT = 1.8;
    const mult = S.combo >= 8 ? 3 : S.combo >= 4 ? 2 : 1;
    S.score += n * mult;
    drops.push({ x, y, life: .8, txt: '+' + (n * mult) });
    if (mult > 1) { comboEl.textContent = 'COMBO x' + mult; comboEl.classList.add('show'); }
  }
  function hitPlayer() {
    if (S.iframe > 0) return;
    S.hearts--; S.iframe = 1.3; S.shake = .25; S.combo = 0;
    comboEl.classList.remove('show');
    drawHearts();
    pop(player.x, player.y, '#ff6b6b');
    if (S.hearts <= 0) { S.over = true; showCTA(false); }
  }

  // ---------- loop ----------
  let last = 0;
  function frame(ts) {
    const dt = Math.min(.033, (ts - last) / 1000 || .016); last = ts;
    S.t += dt;
    if (started && !S.over) update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  function update(dt) {
    player.x += (player.tx - player.x) * Math.min(1, dt * 14);
    if (S.iframe > 0) S.iframe -= dt;

    // auto-fire upward (multishot while a powerup is active)
    fireT -= dt; multiT -= dt;
    if (fireT <= 0) {
      fireT = multiT > 0 ? .12 : .2;
      if (multiT > 0) {
        bullets.push({ x: player.x - 14, y: player.y - 26, vy: -640, r: 12 });
        bullets.push({ x: player.x + 14, y: player.y - 26, vy: -640, r: 12 });
      } else bullets.push({ x: player.x, y: player.y - 26, vy: -640, r: 12 });
    }
    for (const b of bullets) b.y += b.vy * dt;
    bullets = bullets.filter(b => b.y > -30);

    // formation movement: fly in, hold, then sway / drop / figure-eight
    formT += dt;
    for (const e of enemies) {
      const sway = Math.sin(formT * 1.5) * (26 + wave * 5);
      let ox = sway, oy = 0;
      if (pattern === 1) oy = Math.abs(Math.sin(formT * 1.1)) * 26;              // SwayAndDrop
      if (pattern === 2) { ox = Math.sin(formT * 1.6) * 34; oy = Math.sin(formT * 3.2) * 16; } // FigureEight
      const tx = e.hx + ox, ty = e.hy + oy;
      e.x += (tx - e.x) * Math.min(1, dt * 2.4);
      e.y += (ty - e.y) * Math.min(1, dt * 2.4);

      // enemies shoot DOWN at you — 35% aimed, like the real game
      e.fireT -= dt;
      if (e.fireT <= 0 && e.y > 20) {
        e.fireT = Math.max(1.1, 2.8 - wave * .35) + Math.random();
        let vx = 0, vy = 190 + wave * 18;
        if (Math.random() < .35) {
          const dx = player.x - e.x, dy = player.y - e.y, d = Math.hypot(dx, dy) || 1;
          vx = dx / d * (150 + wave * 12); vy = dy / d * (150 + wave * 12);
        }
        eshots.push({ x: e.x, y: e.y + e.r * .6, vx, vy, r: 13 });
      }
    }

    if (boss) {
      boss.y += (boss.hy - boss.y) * Math.min(1, dt * 2);
      boss.x += boss.dir * 105 * dt;
      if (boss.x > W - 76 || boss.x < 76) boss.dir *= -1;
      boss.fireT -= dt;
      if (boss.fireT <= 0) {
        boss.fireT = 1.5;
        for (let i = -2; i <= 2; i++)
          eshots.push({ x: boss.x, y: boss.y + 52, vx: i * 62, vy: 210, r: 14 });
      }
    }

    // enemy shots
    for (const s of eshots) { s.x += s.vx * dt; s.y += s.vy * dt; }
    eshots = eshots.filter(s => s.y < H + 30 && s.x > -30 && s.x < W + 30);
    for (const s of eshots) {
      if ((s.x - player.x) ** 2 + (s.y - player.y) ** 2 < (s.r + player.r) ** 2) {
        s.y = H + 999; hitPlayer();
      }
    }
    eshots = eshots.filter(s => s.y < H + 30);

    // player bullets vs enemies
    for (const b of bullets) {
      for (const e of enemies) {
        if (e.dead) continue;
        if ((b.x - e.x) ** 2 + (b.y - e.y) ** 2 < (e.r + b.r) ** 2) {
          b.y = -999; e.hp--;
          if (e.hp <= 0) {
            e.dead = true; pop(e.x, e.y, e.kind === 'soap' ? '#9fe8ff' : '#a6f06a');
            addScore(10, e.x, e.y); S.shake = .1;
            if (Math.random() < .18) picks.push({ x: e.x, y: e.y, vy: 90, r: 16 });
          }
        }
      }
      if (boss && (b.x - boss.x) ** 2 + (b.y - boss.y) ** 2 < (72 + b.r) ** 2) {
        b.y = -999; bossHP--; S.shake = .08; pop(b.x, b.y, '#ffd166');
        bossfill.style.width = Math.max(0, bossHP / bossMax * 100) + '%';
        if (bossHP <= 0) { pop(boss.x, boss.y, '#ffd166'); boss = null; S.won = true; S.over = true; showCTA(true); }
      }
    }
    enemies = enemies.filter(e => !e.dead);
    bullets = bullets.filter(b => b.y > -30);

    // powerup pickups (shows the game has depth)
    for (const p of picks) p.y += p.vy * dt;
    for (const p of picks) {
      if ((p.x - player.x) ** 2 + (p.y - player.y) ** 2 < (p.r + player.r) ** 2) {
        p.y = H + 999; multiT = 6; toast('MULTISHOT!');
      }
    }
    picks = picks.filter(p => p.y < H + 40);

    // wave cleared -> next
    if (!boss && enemies.length === 0 && !waveClearing) {
      waveClearing = true;
      setTimeout(() => { if (!S.over) nextWave(); }, 700);
    }

    S.comboT -= dt;
    if (S.comboT <= 0 && S.combo) { S.combo = 0; comboEl.classList.remove('show'); }
    for (const p of pops) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 240 * dt; }
    pops = pops.filter(p => p.life > 0);
    for (const d of drops) { d.life -= dt; d.y -= 38 * dt; }
    drops = drops.filter(d => d.life > 0);
    for (const b of bubbles) { b.y -= b.s * dt; if (b.y < -20) { b.y = H + 20; b.x = Math.random() * W; } }
    if (S.shake > 0) S.shake -= dt;
    hud.textContent = 'SCORE ' + S.score;

    // end on GAME time (an ad container that throttles rAF must not cut the run short)
    if (S.t > 40 && !S.over) { S.over = true; showCTA(false); }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    if (img.bg && img.bg.complete && img.bg.naturalWidth) {
      const s = Math.max(W / img.bg.width, H / img.bg.height);
      ctx.drawImage(img.bg, (W - img.bg.width * s) / 2, (H - img.bg.height * s) / 2, img.bg.width * s, img.bg.height * s);
    } else { ctx.fillStyle = '#0e1c46'; ctx.fillRect(0, 0, W, H); }

    ctx.save();
    if (S.shake > 0) ctx.translate((Math.random() - .5) * 9, (Math.random() - .5) * 9);

    for (const b of bubbles) {
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.28);
      ctx.fillStyle = 'rgba(255,255,255,' + b.a + ')'; ctx.fill();
    }

    for (const e of enemies) {
      const im = e.kind === 'soap' ? img.soap : img.germ;
      if (im && im.complete && im.naturalWidth) ctx.drawImage(im, e.x - e.r, e.y - e.r, e.r * 2, e.r * 2);
    }

    if (boss) {
      ctx.save(); ctx.shadowColor = '#ff5ec8'; ctx.shadowBlur = 26;
      const im = (img.boss && img.boss.complete && img.boss.naturalWidth) ? img.boss : img.germ;
      ctx.drawImage(im, boss.x - 76, boss.y - 76, 152, 152);
      ctx.restore();
    }

    // player bubbles
    for (const b of bullets) {
      const g = ctx.createRadialGradient(b.x, b.y, 1, b.x, b.y, b.r);
      g.addColorStop(0, '#fff'); g.addColorStop(.6, '#bfe9ff'); g.addColorStop(1, 'rgba(150,220,255,.15)');
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.28); ctx.fillStyle = g; ctx.fill();
    }

    // enemy shots — hot green goo, high contrast so dodging is fair
    for (const s of eshots) {
      if (img.eproj && img.eproj.complete && img.eproj.naturalWidth) {
        ctx.save(); ctx.shadowColor = 'rgba(255,255,255,.85)'; ctx.shadowBlur = 10;
        ctx.drawImage(img.eproj, s.x - s.r * 1.5, s.y - s.r * 1.5, s.r * 3, s.r * 3);
        ctx.restore();
      } else {
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.28);
        ctx.fillStyle = '#b6ff5e'; ctx.shadowColor = '#7dff3a'; ctx.shadowBlur = 12; ctx.fill(); ctx.shadowBlur = 0;
      }
    }

    // pickups
    for (const p of picks) {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.28);
      ctx.fillStyle = 'rgba(255,225,110,.92)'; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = '#fff8d0'; ctx.stroke();
      ctx.fillStyle = '#7a5200'; ctx.font = 'bold 15px system-ui'; ctx.textAlign = 'center';
      ctx.fillText('2x', p.x, p.y + 5);
    }

    // player (blinks while invulnerable)
    if (img.player && img.player.complete && img.player.naturalWidth) {
      const w = 108, h = w * (img.player.height / img.player.width);
      ctx.globalAlpha = (S.iframe > 0 && Math.floor(S.t * 14) % 2) ? .35 : 1;
      ctx.drawImage(img.player, player.x - w / 2, player.y - h / 2, w, h);
      ctx.globalAlpha = 1;
    }

    for (const p of pops) {
      ctx.globalAlpha = Math.max(0, p.life * 2.2);
      ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, 6.28); ctx.fillStyle = p.c; ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.font = 'bold 21px system-ui, sans-serif'; ctx.textAlign = 'center';
    for (const d of drops) {
      ctx.globalAlpha = Math.max(0, d.life);
      ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 4; ctx.strokeText(d.txt, d.x, d.y);
      ctx.fillStyle = '#ffe066'; ctx.fillText(d.txt, d.x, d.y);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // ---------- CTA ----------
  function showCTA(won) {
    document.getElementById('ctaTitle').textContent = won ? 'YOU BEAT THE BOSS!' : "DON'T STOP NOW!";
    document.getElementById('ctaSub').innerHTML = won
      ? 'That was <b>world 1 of 16</b>.<br>15 more worlds and bosses are waiting.'
      : 'You scored <b>' + S.score + '</b>. Keep your run going —<br>revive, upgrade and beat the boss.';
    document.getElementById('installBtn').textContent = won ? 'PLAY ALL 16 WORLDS' : 'CONTINUE — FREE';
    cta.classList.add('show');
    bossbar.style.display = 'none';
    comboEl.classList.remove('show');
  }

  function start() {
    if (started) return;
    resize(); reset(); started = true;
    requestAnimationFrame(frame);
    setTimeout(() => { if (!everDragged) tut.classList.add('pulse'); }, 2200);
  }

  const STORE = 'https://play.google.com/store/apps/details?id=com.chickenspace.bubbletrouble';
  window.installClick = function () {
    try {
      if (window.mraid && mraid.open) return mraid.open(STORE);
      if (window.FbPlayableAd && FbPlayableAd.onCTAClick) return FbPlayableAd.onCTAClick();
      if (window.ExitApi && ExitApi.exit) return ExitApi.exit();
    } catch (e) { }
    window.open(STORE, '_blank');
  };
  document.getElementById('installBtn').addEventListener('click', window.installClick);
  document.getElementById('installTop').addEventListener('click', window.installClick);
})();
</script>
